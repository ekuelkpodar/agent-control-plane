# Minimal Postgres StatefulSet for dev/test clusters.
# Production deployments should use a managed Postgres (cloud-neutral:
# every cloud offers one) or a proper operator (e.g. CloudNativePG).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: acp-postgres
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: postgres
spec:
  serviceName: acp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-control-plane
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "acp"
            - name: POSTGRES_DB
              value: "acp"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: acp-postgres
  namespace: agent-control-plane
  labels:
    app.kubernetes.io/name: agent-control-plane
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
