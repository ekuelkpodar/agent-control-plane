apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml
  - postgres-statefulset.yaml
  - api-deployment.yaml
  - api-service.yaml

commonLabels:
  app.kubernetes.io/name: agent-control-plane
  app.kubernetes.io/managed-by: kustomize

# Secrets (DATABASE_URL, ACP_API_KEY, POSTGRES_PASSWORD) must exist as the
# `acp-secrets` Secret in the target namespace before applying:
#   kubectl create secret generic acp-secrets \
#     --namespace agent-control-plane \
#     --from-literal=DATABASE_URL='postgresql+psycopg://acp:...@acp-postgres:5432/acp' \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=ACP_API_KEY='...'
